---
# Docker Engine from the official apt repository (dist: resolute), with
# daemon.json log caps matching the deployed compose stack (10m x 3),
# engine packages held against unattended upgrades, and the service enabled.

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  become: true

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker apt repository (resolute, deb822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: resolute
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true

- name: Install Docker Engine, Compose plugin and buildx
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

- name: Hold engine packages against unattended upgrades
  ansible.builtin.command: apt-mark hold docker-ce docker-ce-cli containerd.io
  register: docker_apt_mark_hold
  changed_when: "'set on hold' in docker_apt_mark_hold.stdout"
  become: true

- name: Install daemon.json with log caps (10m x 3, matching 008 compose)
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  become: true
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Verify Docker Engine version
  ansible.builtin.command: docker --version
  changed_when: false
  become: true
  tags: verify

- name: Verify Compose plugin
  ansible.builtin.command: docker compose version
  changed_when: false
  become: true
  tags: verify