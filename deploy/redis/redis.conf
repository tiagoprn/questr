# Production Redis config for questr (Phase 1, change 008).
# Mounted read-only into the redis:7.4.11 container at /usr/local/etc/redis/redis.conf.

# Persistence: AOF with everysec fsync, plus RDB save points as a second net.
# Redis holds rate-limit state, which must not vanish on restart.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
dir /data

# Memory cap sits below the container mem_limit (512m) so Redis errors or
# blocks before the kernel OOM killer acts on the container.
maxmemory 400mb

# D2 (resolved): noeviction. Redis holds rate-limit state
# (rate_limiter.py, login_rate_limiter.py, dual_rate_limiter.py); data must
# not silently vanish. With noeviction, writes past maxmemory fail loudly
# instead of evicting live rate-limit state.
maxmemory-policy noeviction
